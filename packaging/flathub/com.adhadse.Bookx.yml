# Flathub manifest for Bookx. This file is what goes into the flathub/com.adhadse.Bookx repository
# (docs/flathub-submission.md). Do not edit the tag/commit by hand: packaging/flathub/prepare.sh <tag>
# writes the final copy and the matching cargo-sources.json.
#
# Differences from the development manifest (build-aux/com.adhadse.Bookx.json): the source is the git
# tag (Flathub builds from a tag and a commit, never from a local directory), and x-checker-data lets
# the Flathub bot open update pull requests.
id: com.adhadse.Bookx
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: bookx

finish-args:
  # window, input, GPU
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # read aloud and audiobooks play through PulseAudio / PipeWire-Pulse
  - --socket=pulseaudio
  # metadata, news, OPDS, WebDAV backups, KOReader sync, the library share server, voice downloads
  - --share=network
  # the default library is ~/Documents/Bookx Library
  - --filesystem=xdg-documents
  # e-readers and USB drives the desktop mounts (Kobo, Kindle, Boox, PocketBook)
  - --filesystem=/run/media
  # MTP phones and e-readers, network shares and cloud drives mounted by GNOME Files (GVfs)
  - --filesystem=xdg-run/gvfs
  - --filesystem=xdg-run/gvfsd
  - --talk-name=org.gtk.vfs.*
  # media keys and the shell media widget during read aloud and audiobooks (MPRIS)
  - --own-name=org.mpris.MediaPlayer2.Bookx.*
  - --env=RUST_LOG=bookx=info

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/bookx/cargo
    CARGO_NET_OFFLINE: 'true'

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
  - /share/doc
  - '*.la'
  - '*.a'

modules:
  # voices for read aloud (phonemes for Kokoro and Piper)
  - name: espeak-ng
    buildsystem: autotools
    builddir: false
    no-parallel-make: true
    config-opts:
      - --without-async
      - --without-mbrola
      - --without-sonic
      - --without-speechplayer
      - --without-pcaudiolib
      - --disable-static
    cleanup:
      - /bin/speak-ng
      - /lib/libespeak-ng.la
      - /share/vim
    sources:
      - type: archive
        url: https://github.com/espeak-ng/espeak-ng/archive/refs/tags/1.52.0.tar.gz
        sha256: bb4338102ff3b49a81423da8a1a158b420124b055b60fa76cfb4b18677130a23
        x-checker-data:
          type: anitya
          project-id: 5440
          stable-only: true
          url-template: https://github.com/espeak-ng/espeak-ng/archive/refs/tags/$version.tar.gz

  - name: bookx
    buildsystem: simple
    build-commands:
      # Flathub refuses machine-translated locales: only the languages in po/reviewed-locales.txt are built in
      - cargo --offline build --release --locked -p bookx -p bookx-cli --features bookx/reviewed-locales-only
      - make install-flatpak PREFIX=/app TARGET_DIR=target/release CARGO_FEATURES=bookx/reviewed-locales-only
    sources:
      - type: git
        url: https://github.com/adhadse/Bookx.git
        tag: v0.3.0
        commit: "0000000000000000000000000000000000000000"
        x-checker-data:
          type: git
          tag-pattern: ^v(\d+\.\d+\.\d+)$
      # crates.io packages from Cargo.lock, regenerated by prepare.sh
      - cargo-sources.json
