# cargo-deny policy: `cargo deny check advisories bans licenses sources`
# (docs/security.md, supply chain). Run by hand or in CI; needs network for the advisory database.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# "Unmaintained" notices (no known vulnerability), reviewed 2026-11-20. Each one needs a replacement plan or a new look
# when the advisory changes; none is silently accepted for ever (see docs/security.md, 2026-11-20 record).
ignore = [
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained notice; direct dependency, only used for formatting and arithmetic on dates, no known flaw" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser unmaintained; used by bookx-editing (font subsetting) on untrusted fonts, bounds-checked safe Rust, no known flaw; watch for a fork" },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz unmaintained; only through resvg/usvg, a dev-dependency used by tests, not shipped" },
    { id = "RUSTSEC-2026-0249", reason = "smartstring unmaintained; pulled in by rhai (function mode of search and replace)" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant unmaintained; D-Bus types for oo7/ashpd (Secret Service)" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names unmaintained; same dependency chain as zvariant" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive unmaintained; same dependency chain as zvariant" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "0BSD",
    "MPL-2.0",
    "bzip2-1.0.6",
    "CDLA-Permissive-2.0",
    "Unlicense",
    "MIT-0",
    "LGPL-2.1-or-later",
    "GPL-3.0-or-later",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
