[package]
name = "bookx-editing"
version = "0.2.0"
authors = ["Anurag Dhadse <hello@adhadse.com>"]
edition = "2021"
rust-version = "1.85"
description = "GUI-free logic behind the Bookx e-book editor: reports, compare, checkpoints, split/merge, spell check, auto-fixes, fonts, images, links, CSS tools"
license = "GPL-3.0-or-later"

[dependencies]
bookx-core = { path = "../bookx-core" }
bookx-convert = { path = "../bookx-convert" }
bookx-text = { path = "../bookx-text" }
anyhow = "1"
encoding_rs = "0.8"
chrono = { version = "0.4", features = ["serde"] }
ego-tree = "0.11"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp"] }
oxipng = { version = "9", default-features = false }
regex = "1"
roxmltree = "0.21"
scraper = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "3"
spellbook = "0.3"
subsetter = "0.2"
ttf-parser = "0.25"
uuid = { version = "1", features = ["v4"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
unicode_names2 = "4.0.0"

[dev-dependencies]
bookx-core = { path = "../bookx-core" }
