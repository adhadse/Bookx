[package]
name = "bookx-comic"
version = "0.3.0-beta.3"
authors = ["Anurag Dhadse <hello@adhadse.com>"]
edition = "2024"
rust-version = "1.85"
description = "Comic reading for Bookx without GTK: page decoding with limits, panel detection, spread layout, zoom and pan maths, page cache and per-book settings"
publish = false
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
