[package]
name = "bookx-plugin"
version = "0.2.0"
authors = ["Anurag Dhadse <hello@adhadse.com>"]
edition = "2021"
rust-version = "1.85"
description = "Sandboxed WebAssembly plugin host for Bookx (pure-Rust wasmi interpreter)"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1"
base64 = "0.22"
bookx-core = { path = "../bookx-core" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
wasmi = "0.51"

[dev-dependencies]
wat = "1"
