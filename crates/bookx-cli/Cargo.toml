[package]
name = "bookx-cli"
version = "0.2.0"
authors = ["Anurag Dhadse <hello@adhadse.com>"]
edition = "2021"
rust-version = "1.85"
description = "Command-line tool of Bookx: convert, inspect, check, manage a library and serve it over OPDS"
license = "GPL-3.0-or-later"

[lib]
name = "bookx_cli"
path = "src/lib.rs"

[[bin]]
name = "bookx-cli"
path = "src/main.rs"

[dependencies]
anyhow = "1"
bookx-backup = { path = "../bookx-backup" }
bookx-core = { path = "../bookx-core" }
bookx-formats = { path = "../bookx-formats" }
bookx-mcp = { path = "../bookx-mcp" }
bookx-convert = { path = "../bookx-convert" }
bookx-serve = { path = "../bookx-serve" }
bookx-sources = { path = "../bookx-sources" }
bookx-store = { path = "../bookx-store" }
clap = { version = "4", features = ["derive"] }
directories = "6"
chrono = "0.4"
serde_json = "1"
roxmltree = "0.21"
uuid = { version = "1", features = ["v4"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
percent-encoding = "2"
url = "2"
bookx-pdf = { path = "../bookx-pdf" }
rusqlite = { version = "0.42", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
