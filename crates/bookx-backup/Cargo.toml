[package]
name = "bookx-backup"
version = "0.2.0"
authors = ["Anurag Dhadse <hello@adhadse.com>"]
edition = "2021"
rust-version = "1.85"
description = "Off-site backups of the Bookx catalogue: destinations, encryption, verify-after-write, retention, restore"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1"
percent-encoding = "2"
bookx-serve = { path = "../bookx-serve" }
bookx-store = { path = "../bookx-store" }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chacha20poly1305 = { version = "0.10", features = ["stream"] }
argon2 = "0.5"
sha2 = "0.10"
getrandom = "0.2"

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
