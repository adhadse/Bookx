[package]
name = "bookx-text"
version = "0.3.0-beta.2"
authors = ["Anurag Dhadse <hello@adhadse.com>"]
edition = "2024"
rust-version = "1.85"
description = "Pure-logic text layout building blocks for Bookx: hyphenation, line breaking, CSS subset, highlights, typography settings, page numbering"
publish = false
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1"
cssparser = "0.38"
hypher = "0.1"
scraper = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
