[package]
name = "bookx-tts"
version = "0.3.0-beta.3"
authors = ["Anurag Dhadse <hello@adhadse.com>"]
edition = "2024"
rust-version = "1.92"
description = "Read aloud for Bookx: sentence splitting, pluggable speech engines (Kokoro and Piper through ONNX Runtime, OpenAI-compatible servers), model downloads, gapless playback"
publish = false
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1"
bookx-audio = { path = "../bookx-audio" }
flate2 = "1"
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
zip = { version = "9", default-features = false }
tar = "0.4"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[dev-dependencies]
zip = { version = "9", default-features = false, features = ["deflate"] }
uuid = { version = "1", features = ["v4"] }
