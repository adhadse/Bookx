# cargo-nextest settings (build-aux/coverage.sh; `cargo nextest run` uses them too).
# Every test is its own process, so tests cannot share state; the ones below also need the machine to themselves.

[profile.default]
# a test that hangs is killed instead of holding the whole run
slow-timeout = { period = "60s", terminate-after = 5 }

# the PR report (build-aux/ci-report.py) reads the counts from <target>/nextest/default/junit.xml
[profile.default.junit]
path = "junit.xml"

# counts /proc/self threads and descriptors over 2000 requests: a loaded machine makes it fail
[[profile.default.overrides]]
filter = "binary(soak)"
threads-required = "num-cpus"

# calibredb refuses to start while another calibre program (also another calibredb) runs: these two take turns
[test-groups]
calibredb = { max-threads = 1 }

[[profile.default.overrides]]
filter = "binary(calibre_export) & (test(calibredb_opens_the_export) | test(custom_columns_go_to_calibre_and_come_back))"
test-group = "calibredb"
