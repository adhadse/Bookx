[package]
name = "bookx-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
description = "Fuzz targets for the parsers and wire formats of Bookx (docs/security.md, P1.1)"

# Not part of the main workspace: `cargo test --workspace` never builds it.
[workspace]

[features]
# `cargo fuzz run <target>` builds with libFuzzer (nightly). Without it each target is an ordinary
# program that replays the files named on its command line, so it also checks on stable:
#   cargo check --manifest-path fuzz/Cargo.toml --no-default-features
default = ["libfuzzer"]
libfuzzer = ["dep:libfuzzer-sys"]

[dependencies]
libfuzzer-sys = { version = "0.4", optional = true }
bookx-core = { path = "../crates/bookx-core" }
bookx-formats = { path = "../crates/bookx-formats" }
bookx-text = { path = "../crates/bookx-text" }
bookx-serve = { path = "../crates/bookx-serve" }
bookx-backup = { path = "../crates/bookx-backup" }
bookx-plugin = { path = "../crates/bookx-plugin" }
bookx-comic = { path = "../crates/bookx-comic" }
bookx-pdf = { path = "../crates/bookx-pdf" }
bookx-sources = { path = "../crates/bookx-sources" }
bookx-secrets = { path = "../crates/bookx-secrets" }
serde_json = "1"

[profile.release]
debug = 1

[[bin]]
name = "epub"
path = "fuzz_targets/epub.rs"
test = false
doc = false
bench = false

[[bin]]
name = "formats"
path = "fuzz_targets/formats.rs"
test = false
doc = false
