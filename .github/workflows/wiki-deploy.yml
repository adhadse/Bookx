name: Wiki deploy

# The public wiki (https://bookx.adhadse.com, GitHub Pages) only changes with a release, so it never describes a feature
# that no download has. It is deployed
#   * by release.yml, after the release is published, built from the tagged commit;
#   * by hand: Actions > Wiki deploy > Run workflow. `ref` empty = the latest release tag (a stable one if there is
#     one). Typing another tag or a branch (main included) is a conscious choice: it publishes that state of the docs.
# Pushes to main and pull requests only build and check the wiki (ci.yml, job `wiki`).
#
# Settings > Environments > github-pages > Deployment branches and tags must allow the ref: `main`, `master` and the tag
# pattern `v*` (docs/ci-gates.md).
on:
  workflow_call:
    inputs:
      ref:
        description: "Tag, branch or commit to publish"
        type: string
        required: true
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or branch to publish (empty: the latest release tag; main only if you mean it)"
        type: string
        default: ""

permissions:
  contents: read

env:
  # The pinned Zensical version lives in build-aux/wiki.sh (ZENSICAL_VERSION).
  VENV: ${{ github.workspace }}/.cache/wiki-venv

jobs:
  deploy:
    name: Build and deploy the wiki
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      id-token: write
    # deployments queue and are never cancelled
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: ref
        name: Which ref
        env:
          INPUT_REF: ${{ inputs.ref }}
        run: |
          ref=$INPUT_REF
          if [ -z "$ref" ]; then
            tags=$(git ls-remote --tags --refs "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" 'v*' | sed 's#.*refs/tags/##')
            ref=$(printf '%s\n' "$tags" | grep -Ev -- '-(alpha|beta|rc)' | sort -V | tail -n 1)
            [ -n "$ref" ] || ref=$(printf '%s\n' "$tags" | sort -V | tail -n 1)
          fi
          if [ -z "$ref" ]; then
            echo "::error::there is no release tag yet: run this workflow with a ref (a tag, or main on purpose)"
            exit 1
          fi
          echo "Publishing the wiki of: $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.ref.outputs.ref }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Cache the Zensical environment
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.VENV }}
          key: wiki-venv-${{ hashFiles('build-aux/wiki.sh') }}
      - name: Build the wiki and check it (the browser check ran in CI on this commit)
        env:
          WIKI_BROWSER: "0"
        run: build-aux/wiki.sh
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: wiki/site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
