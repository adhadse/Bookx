name: PR report

# Posts ONE comment on the pull request (updated in place on every push) with the jobs, the tests, the
# coverage per crate against the baseline and the patch coverage of the change, and links to the artifacts.
#
# Why workflow_run: a pull request from a fork or from Dependabot gets a read-only token, so CI itself cannot
# comment. This workflow runs from the DEFAULT branch with a token that may write comments, after CI finished.
# It never checks out or runs code of the pull request: build-aux/ci-report.py comes from the default branch, and
# the artifacts of the CI run are only read as data (size-limited, parsed, escaped). Keep it that way: do not add a
# step that executes anything from the downloaded files. docs/ci-gates.md, "The pull request comment".
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

jobs:
  comment:
    name: Comment on the pull request
    if: github.event.workflow_run.event == 'pull_request' || (github.event.workflow_run.event == 'workflow_dispatch' && startsWith(github.event.workflow_run.head_branch, 'dependabot/'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write
      actions: read
      contents: read
    concurrency:
      group: pr-report-${{ github.event.workflow_run.head_sha }}
      cancel-in-progress: true
    steps:
      # the default branch (what this workflow was started from), never the head of the pull request
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Artifacts of the CI run (data only)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          pattern: report-*
          path: report
        continue-on-error: true # a run without artifacts (everything skipped) still gets its jobs table
      - name: Build the report and post or update the comment
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          # the pull request of this commit (workflow_run.pull_requests is empty for forks)
          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/pulls" --jq '[.[] | select(.state == "open")][0].number // empty')
          if [ -z "$pr" ]; then echo "no open pull request for $HEAD_SHA"; exit 0; fi
          mkdir -p report
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" > report/jobs.json
          python3 build-aux/ci-report.py --jobs report/jobs.json --artifacts report --baseline build-aux/coverage-baseline.json \
            --run-url "$RUN_URL" --sha "$HEAD_SHA" --pr-comment > comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$pr/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- bookx-ci-report -->"))) | .id' | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@comment.md --jq .html_url
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$pr/comments" -F body=@comment.md --jq .html_url
          fi
