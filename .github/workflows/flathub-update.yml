# Opens a pull request in flathub/com.adhadse.Bookx when a Bookx release is published. Deterministic: no AI,
# no auto-merge. Flathub builds a test build for the pull request; the maintainer installs it, tests it and
# merges by hand. Setup, secret, rollback and failure modes: docs/flathub-automation.md.
#
# Only the owner enables this, after the Flathub repository exists: add the secret FLATHUB_UPDATE_TOKEN and
# put {"disable-external-data-checker": true} into flathub.json of the Flathub repository (otherwise
# Flathub's own bot opens a second pull request for the same tag). Without the secret the real run fails
# early; a dry run (workflow_dispatch, dry_run on) needs no secret and opens nothing.
name: flathub-update

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.3.1
        required: true
        type: string
      dry_run:
        description: Only run the script and upload the diff, open no pull request
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: flathub-update
  cancel-in-progress: false

jobs:
  update:
    name: Pull request in flathub/com.adhadse.Bookx
    # releases of forks and pre-releases never go to Flathub (stable only)
    if: github.repository == 'adhadse/Bookx' && !(github.event_name == 'release' && github.event.release.prerelease)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      HAS_TOKEN: ${{ secrets.FLATHUB_UPDATE_TOKEN != '' }}
    steps:
      - name: Tag looks like vX.Y.Z and the secret exists (unless dry run)
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag '$TAG' is not vX.Y.Z"; exit 1; }
          if [ "$DRY_RUN" != true ] && [ "$HAS_TOKEN" != true ]; then
            echo "::error::secret FLATHUB_UPDATE_TOKEN is not set (docs/flathub-automation.md, one-time setup)"; exit 1
          fi

      # the script comes from the commit that runs this workflow, the data from the tag
      - name: Checkout the update script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tools
          persist-credentials: false
          sparse-checkout: build-aux/flathub-update.py
          sparse-checkout-cone-mode: false
      - name: Checkout Bookx at the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          path: bookx
          persist-credentials: false
          sparse-checkout: |
            Cargo.toml
            Cargo.lock
            CHANGELOG.md
            data/com.adhadse.Bookx.metainfo.xml
            build-aux/com.adhadse.Bookx.json
          sparse-checkout-cone-mode: false
      - name: Checkout the Flathub repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: flathub/com.adhadse.Bookx
          token: ${{ secrets.FLATHUB_UPDATE_TOKEN || github.token }}
          path: flathub
          persist-credentials: false
      - name: Checkout flatpak-cargo-generator (pinned commit of flatpak/flatpak-builder-tools)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: flatpak/flatpak-builder-tools
          ref: 9d86d336a39b9af38b86f114b6ce5820fe260f91
          path: flatpak-builder-tools
          persist-credentials: false
          sparse-checkout: cargo
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the generator's dependencies (the bounds of its own header)
        run: python3 -m pip install "aiohttp<4.0.0,>=3.9.5" "tomlkit>=0.13.3,<1.0"

      - name: Is Flathub's own update bot switched off?
        run: |
          if [ -f flathub/flathub.json ]; then
            python3 tools/build-aux/flathub-update.py --check-flathub-json flathub/flathub.json \
              || echo '::warning::flathub.json lacks disable-external-data-checker: true; Flathub'"'"'s bot may open a second pull request'
          else
            echo "::warning::flathub.json does not exist in the Flathub repository"
          fi
      - name: Update the manifest and cargo-sources.json
        run: |
          python3 tools/build-aux/flathub-update.py \
            --manifest flathub/com.adhadse.Bookx.yml \
            --repo bookx --tag "$TAG" \
            --cargo-generator flatpak-builder-tools/cargo/flatpak-cargo-generator.py \
            --body-file "$RUNNER_TEMP/pr-body.txt"
          git -C flathub status --short
          git -C flathub diff --stat

      - name: Dry run, keep the diff
        if: env.DRY_RUN == 'true'
        run: |
          git -C flathub diff > "$RUNNER_TEMP/flathub-update.diff"
          cat "$RUNNER_TEMP/pr-body.txt"
      - name: Upload the diff and the pull request text (dry run)
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flathub-update-${{ env.TAG }}
          path: |
            ${{ runner.temp }}/flathub-update.diff
            ${{ runner.temp }}/pr-body.txt
          retention-days: 14

      - name: Open the pull request (no auto-merge, the maintainer merges after the test build)
        if: env.DRY_RUN != 'true'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ secrets.FLATHUB_UPDATE_TOKEN }}
          path: flathub
          add-paths: |
            com.adhadse.Bookx.yml
            cargo-sources.json
          branch: update-${{ env.TAG }}
          title: Update Bookx to ${{ env.TAG }}
          commit-message: Update Bookx to ${{ env.TAG }}
          body-path: ${{ runner.temp }}/pr-body.txt
          delete-branch: false
