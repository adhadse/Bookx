# Builds the Flatpak bundle and lints the manifest and metainfo the way Flathub does. Publishes nothing:
# the bundle is a workflow artifact (releases come from release.yml, Flathub from its own repository:
# docs/flathub-submission.md). Written without being run (docs/remaining-work.md H.1): the container
# image tag and the linter invocation are from memory.
name: package-flatpak

on:
  workflow_dispatch:
  pull_request:
    paths:
      - build-aux/com.adhadse.Bookx.json
      - build-aux/cargo-sources.json
      - build-aux/flatpak-cargo-sources.py
      - packaging/flathub/**
      - data/com.adhadse.Bookx.*
      - Cargo.lock
      - .github/workflows/package-flatpak.yml

permissions:
  contents: read

concurrency:
  group: package-flatpak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    name: Flatpak bundle (x86_64)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cargo sources match Cargo.lock
        run: python3 build-aux/flatpak-cargo-sources.py --check
      - name: Desktop file and metainfo
        run: |
          desktop-file-validate data/com.adhadse.Bookx.desktop
          appstreamcli validate --no-net --pedantic data/com.adhadse.Bookx.metainfo.xml
      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@master
        with:
          bundle: bookx.flatpak
          manifest-path: build-aux/com.adhadse.Bookx.json
          cache-key: flatpak-package-${{ github.sha }}
          upload-artifact: false
      - name: Lint the manifest and the build repository (what Flathub runs)
        continue-on-error: true
        run: |
          flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install -y --noninteractive flathub org.flatpak.Builder
          flatpak run --command=flatpak-builder-lint org.flatpak.Builder manifest build-aux/com.adhadse.Bookx.json
          flatpak run --command=flatpak-builder-lint org.flatpak.Builder appstream data/com.adhadse.Bookx.metainfo.xml
      - name: Checksum
        run: sha256sum bookx.flatpak > bookx.flatpak.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: bookx-flatpak
          path: |
            bookx.flatpak
            bookx.flatpak.sha256
          retention-days: 7
