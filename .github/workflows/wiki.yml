name: Wiki

# Builds the public wiki (wiki/, Zensical) and publishes it to https://bookx.adhadse.com
# with GitHub Pages. In the repository settings, Pages > Source must be "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "wiki/**"
      - "build-aux/wiki.sh"
      - "build-aux/wiki-optimize.py"
      - "build-aux/wiki-theme-check.py"
      - "build-aux/check-site-links.py"
      - "build-aux/check-social-cards.py"
      - "build-aux/check-wiki-pictures.py"
      - "build-aux/check-wiki-frames.py"
      - "build-aux/check-wiki-centred.py"
      - "build-aux/check-sync-endpoint.sh"
      - "build-aux/wiki-pictures.txt"
      - ".github/workflows/wiki.yml"
  pull_request:
    paths:
      - "wiki/**"
      - "build-aux/wiki.sh"
      - "build-aux/wiki-optimize.py"
      - "build-aux/wiki-theme-check.py"
      - "build-aux/check-site-links.py"
      - "build-aux/check-social-cards.py"
      - "build-aux/check-wiki-pictures.py"
      - "build-aux/check-wiki-frames.py"
      - "build-aux/check-wiki-centred.py"
      - "build-aux/check-sync-endpoint.sh"
      - "build-aux/wiki-pictures.txt"
      - ".github/workflows/wiki.yml"
  workflow_dispatch:

permissions:
  contents: read

# Deployments queue (never cancelled); pull request builds only cancel older runs of the same PR.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('wiki-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The pinned Zensical version lives in build-aux/wiki.sh (ZENSICAL_VERSION).
  VENV: ${{ github.workspace }}/.cache/wiki-venv

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Cache the Zensical environment
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.VENV }}
          key: wiki-venv-${{ hashFiles('build-aux/wiki.sh') }}
      - name: Build the wiki and check links
        run: build-aux/wiki.sh
      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: wiki/site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
