name: Coverage (UI tier)

# How much of src/ui/** the Broadway scenarios reach (docs/ci-gates.md). As slow as the whole UI suite, so nightly and on
# demand rather than on every pull request; the per-PR gate is the `coverage` job in ci.yml.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "5"

concurrency:
  group: coverage-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage-ui:
    name: UI coverage (Broadway scenarios, instrumented)
    runs-on: ubuntu-latest
    timeout-minutes: 240
    container: fedora:latest
    steps:
      - name: Install system dependencies
        run: |
          dnf install -y gcc gcc-c++ make pkgconf-pkg-config rustup \
            gtk4 gtk4-devel libadwaita-devel gtksourceview5-devel pango-devel cairo-devel \
            gdk-pixbuf2-devel openssl-devel gettext \
            dbus-daemon xz tar gzip curl python3 git procps-ng
      - name: Rust with the LLVM tools that match its compiler
        run: |
          rustup-init -y --profile minimal --default-toolchain stable -c llvm-tools-preview
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: cargo-llvm-cov
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-coverage-ui-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-coverage-ui-${{ runner.os }}-
      - name: Broadway is available
        run: command -v gtk4-broadwayd && command -v dbus-run-session
      - name: UI coverage
        run: JOBS=2 BOOKX_SECRETS=memory build-aux/coverage-ui.sh --html
      - name: Coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-ui
          path: |
            target/llvm-cov/lcov-ui.info
            target/llvm-cov/ui
          if-no-files-found: ignore
