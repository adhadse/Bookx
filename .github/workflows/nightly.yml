name: Nightly

# Slow checks that do not belong in every pull request:
#   coverage-ui  how much of src/ui/** the Broadway scenarios reach (docs/ci-gates.md, "UI tier")
#   flatpak      a Flatpak build with cold caches, so a build that only works thanks to a stale cache shows up
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "5"
  RUST_TOOLCHAIN: "1.93.1"
  RUSTUP_INIT_SKIP_SUDO_CHECK: "yes"
  LANG: C.UTF-8

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage-ui:
    name: UI coverage (Broadway scenarios, instrumented)
    runs-on: ubuntu-latest
    timeout-minutes: 240
    container: fedora:latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Install system dependencies
        run: |
          dnf install -y gcc gcc-c++ make pkgconf-pkg-config rustup \
            gtk4 gtk4-devel libadwaita-devel gtksourceview5-devel pango-devel cairo-devel \
            gdk-pixbuf2-devel openssl-devel gettext \
            dbus-daemon xz tar gzip curl python3 git procps-ng zip unzip \
            espeak-ng pulseaudio-utils xxd \
            google-noto-sans-fonts google-noto-serif-fonts abattis-cantarell-vf-fonts dejavu-sans-fonts \
            google-noto-sans-cjk-fonts google-noto-sans-arabic-fonts google-noto-sans-devanagari-fonts \
            adwaita-sans-fonts adwaita-mono-fonts hunspell-en-US
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust with the LLVM tools that match its compiler
        run: |
          rustup-init -y --profile minimal --default-toolchain "$RUST_TOOLCHAIN" -c llvm-tools-preview
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: coverage-ui
      - uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: cargo-llvm-cov
      - name: Broadway is available
        run: command -v gtk4-broadwayd && command -v dbus-run-session
      - name: UI coverage
        # two scenarios with a time budget (pdf_big, big_book_editor) failed on the unoptimised instrumented build with
        # 4 scenarios at once; a little optimisation and 2 at once, as in the shards of ci.yml
        env:
          CARGO_PROFILE_DEV_OPT_LEVEL: "1"
        run: JOBS=2 BOOKX_SECRETS=memory build-aux/coverage-ui.sh --html
      - name: Coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-ui
          path: |
            target/llvm-cov/lcov-ui.info
            target/llvm-cov/ui
          if-no-files-found: ignore

  flatpak:
    name: Flatpak, cold caches
    uses: ./.github/workflows/_flatpak.yml
    with:
      cache: false
      lint: true
