name: Nightly

# The full suite on main. A push to main only refills the caches (ci.yml, `warm-rust` and `build-ui`), because the pull
# request that was merged already ran everything on an up-to-date branch; this run is the safety net and also what
# release.yml accepts as proof for a commit.
#   ci           the whole of ci.yml as for a pull request with the UI scenarios forced (quick checks, Rust with coverage,
#                UI shards, wiki build, Flatpak), its `required` job is the verdict
#   coverage-ui  how much of src/ui/** the Broadway scenarios reach (docs/ci-gates.md, "UI tier")
#   flatpak      a Flatpak build with cold caches, so a build that only works thanks to a stale cache shows up
#   notify       one GitHub issue, "Nightly failed", opened or commented on when something is red and closed when green
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "5"
  RUST_TOOLCHAIN: "1.93.1"
  RUSTUP_INIT_SKIP_SUDO_CHECK: "yes"
  LANG: C.UTF-8

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI on main
    uses: ./.github/workflows/ci.yml
    # a called workflow cannot ask for more than this: its `report` job wants to comment on pull requests
    permissions:
      contents: read
      actions: read
      pull-requests: write

  coverage-ui:
    name: UI coverage (Broadway scenarios, instrumented)
    runs-on: ubuntu-latest
    timeout-minutes: 240
    container: fedora:latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Install system dependencies
        run: |
          dnf install -y gcc gcc-c++ make pkgconf-pkg-config rustup \
            gtk4 gtk4-devel libadwaita-devel gtksourceview5-devel pango-devel cairo-devel \
            gdk-pixbuf2-devel openssl-devel gettext \
            dbus-daemon xz tar gzip curl python3 git procps-ng zip unzip \
            espeak-ng pulseaudio-utils xxd \
            google-noto-sans-fonts google-noto-serif-fonts abattis-cantarell-vf-fonts dejavu-sans-fonts \
            google-noto-sans-cjk-fonts google-noto-sans-arabic-fonts google-noto-sans-devanagari-fonts \
            adwaita-sans-fonts adwaita-mono-fonts hunspell-en-US
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust with the LLVM tools that match its compiler
        run: |
          rustup-init -y --profile minimal --default-toolchain "$RUST_TOOLCHAIN" -c llvm-tools-preview
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: coverage-ui
      - uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: cargo-llvm-cov
      - name: Broadway is available
        run: command -v gtk4-broadwayd && command -v dbus-run-session
      - name: UI coverage
        # two scenarios with a time budget (pdf_big, big_book_editor) failed on the unoptimised instrumented build with
        # 4 scenarios at once; a little optimisation and 2 at once, as in the shards of ci.yml
        env:
          CARGO_PROFILE_DEV_OPT_LEVEL: "1"
        run: JOBS=2 BOOKX_SECRETS=memory build-aux/coverage-ui.sh --html
      - name: Coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-ui
          path: |
            target/llvm-cov/lcov-ui.info
            target/llvm-cov/ui
          if-no-files-found: ignore

  flatpak:
    name: Flatpak, cold caches
    uses: ./.github/workflows/_flatpak.yml
    with:
      cache: false
      lint: true

  notify:
    name: Report the result
    needs: [ci, coverage-ui, flatpak]
    if: ${{ always() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open, update or close the issue "Nightly failed"
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Nightly failed"
          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number,title \
            --jq "[.[] | select(.title == \"$title\")][0].number // empty")
          summary=$(echo "$NEEDS" | jq -r 'to_entries[] | "- \(.key): \(.value.result)"')
          if echo "$NEEDS" | jq -e '[.[].result] | any(. == "failure" or . == "cancelled")' >/dev/null; then
            body=$(printf 'The nightly run is red: %s\n\n%s\n' "$RUN_URL" "$summary")
            if [ -n "$num" ]; then gh issue comment "$num" --repo "$GITHUB_REPOSITORY" --body "$body"
            else gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"; fi
          elif [ -n "$num" ]; then
            gh issue comment "$num" --repo "$GITHUB_REPOSITORY" --body "Green again: $RUN_URL"
            gh issue close "$num" --repo "$GITHUB_REPOSITORY"
          fi
