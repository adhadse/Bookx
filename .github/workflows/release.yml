name: Release

# Push a tag like v0.3.0: checks that the tag, Cargo.toml, the metainfo and CHANGELOG.md agree, builds the release
# binaries, a tarball, a .deb, an .rpm and a Flatpak bundle, and attaches them with SHA256SUMS to a GitHub release.
# Nothing here creates or pushes a tag. This workflow has never run on GitHub: it was only parsed locally.
# Signing (docs/security.md, "Release signing"): there is no signing key to keep. The publish job signs every file with
# Sigstore cosign "keyless" (the GitHub Actions OIDC identity of this workflow, recorded in the public Rekor log) and
# attaches a GitHub build-provenance attestation (SLSA style). Users verify with `cosign verify-blob` or
# `gh attestation verify` (wiki/docs/install.md, "Verify your download").

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  tarball:
    name: Release build and tarball
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies
        run: |
          dnf install -y gcc gcc-c++ make pkgconf-pkg-config rust cargo \
            gtk4-devel libadwaita-devel gtksourceview5-devel pango-devel cairo-devel \
            gdk-pixbuf2-devel openssl-devel gettext tar gzip git python3 python3-pyyaml \
            desktop-file-utils appstream libxml2
      - name: Release check (versions, changelog, metainfo, Flatpak sources, golden plugins)
        run: |
          git config --global --add safe.directory "$PWD"
          case "$GITHUB_REF" in refs/tags/*) tag="$GITHUB_REF_NAME" ;; *) tag="" ;; esac
          build-aux/release-check.sh $tag
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-release-${{ hashFiles('**/Cargo.lock') }}
      - name: Build
        run: cargo build --release --locked -p bookx -p bookx-cli
      - name: Tarball
        run: build-aux/tarball.sh dist
      - name: Debian and RPM packages
        run: |
          cargo install --locked cargo-deb cargo-generate-rpm
          cargo deb --no-build -p bookx --output dist/
          cargo generate-rpm -p . -o dist/
      - uses: actions/upload-artifact@v4
        with:
          name: tarball
          path: |
            dist/*

  flatpak:
    name: Flatpak bundle
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      - name: Regenerate the offline cargo sources
        run: python3 build-aux/flatpak-cargo-sources.py
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6.8
        with:
          bundle: bookx.flatpak
          manifest-path: build-aux/com.adhadse.Bookx.json
          cache-key: flatpak-release-${{ github.sha }}
      - name: Checksum
        run: sha256sum bookx.flatpak > bookx.flatpak.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: |
            bookx.flatpak
            bookx.flatpak.sha256

  publish:
    name: Sign and attach to the release
    needs: [tarball, flatpak]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write       # keyless signing: the workflow's OIDC token
      attestations: write   # build provenance
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums of everything
        run: |
          cd dist
          sha256sum $(ls | grep -v -e '\.sha256$' -e '^SHA256SUMS$') > SHA256SUMS
          cat SHA256SUMS
      - name: Build provenance attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign every file with cosign (keyless, bundle next to the file)
        run: |
          cd dist
          for f in $(ls | grep -v '\.sigstore\.json$'); do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
          ls -l
      - name: Verify what was just signed (same check users run)
        run: |
          cd dist
          for f in $(ls | grep -v '\.sigstore\.json$'); do
            cosign verify-blob \
              --bundle "$f.sigstore.json" \
              --certificate-identity-regexp '^https://github\.com/adhadse/Bookx/\.github/workflows/release\.yml@refs/tags/v' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$f"
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
