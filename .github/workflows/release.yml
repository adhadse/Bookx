name: Release

# Push a tag like v0.2.0: checks that the tag, Cargo.toml, the metainfo and CHANGELOG.md agree, builds the release
# binaries, a tarball, a .deb, an .rpm and a Flatpak bundle, and attaches them with SHA256SUMS to a GitHub release.
# Nothing here creates or pushes a tag. This workflow has never run on GitHub: it was only parsed locally.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  tarball:
    name: Release build and tarball
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          dnf install -y gcc gcc-c++ make pkgconf-pkg-config rust cargo \
            gtk4-devel libadwaita-devel gtksourceview5-devel pango-devel cairo-devel \
            gdk-pixbuf2-devel openssl-devel gettext tar gzip git python3 python3-pyyaml \
            desktop-file-utils appstream libxml2
      - name: Release check (versions, changelog, metainfo, Flatpak sources, golden plugins)
        run: |
          git config --global --add safe.directory "$PWD"
          case "$GITHUB_REF" in refs/tags/*) tag="$GITHUB_REF_NAME" ;; *) tag="" ;; esac
          build-aux/release-check.sh $tag
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-release-${{ hashFiles('**/Cargo.lock') }}
      - name: Build
        run: cargo build --release --locked -p bookx -p bookx-cli
      - name: Tarball
        run: build-aux/tarball.sh dist
      - name: Debian and RPM packages
        run: |
          cargo install --locked cargo-deb cargo-generate-rpm
          cargo deb --no-build -p bookx --output dist/
          cargo generate-rpm -p . -o dist/
      - uses: actions/upload-artifact@v4
        with:
          name: tarball
          path: |
            dist/*

  flatpak:
    name: Flatpak bundle
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate the offline cargo sources
        run: python3 build-aux/flatpak-cargo-sources.py
      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@master
        with:
          bundle: bookx.flatpak
          manifest-path: build-aux/com.adhadse.Bookx.json
          cache-key: flatpak-release-${{ github.sha }}
      - name: Checksum
        run: sha256sum bookx.flatpak > bookx.flatpak.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: |
            bookx.flatpak
            bookx.flatpak.sha256

  publish:
    name: Attach to the release
    needs: [tarball, flatpak]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums of everything
        run: |
          cd dist
          sha256sum $(ls | grep -v -e '\.sha256$' -e '^SHA256SUMS$') > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
