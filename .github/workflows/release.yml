name: Release

# Push a tag like v0.3.0 (or v0.3.0-beta.1, -rc.1, -alpha.1; every release is a normal release marked Latest, never a GitHub pre-release,
# so it shows in the repository's Releases section). The jobs:
#   gates     the commit of the tag has to have passed CI already (build-aux/release-gate.py: its `required` check, a green
#             Nightly, or the merged pull request with a green `required` check and an equal tree)
#   tarball   release build (on Fedora 43: the glibc floor), tarball, .deb, .rpm
#   distros   installs the .deb/.rpm/tarball in real distribution images and starts the app (build-aux/distro-matrix.sh)
#   flatpak   the Flatpak bundle (the reusable _flatpak.yml, the same build CI does)
#   publish   checksums, build provenance, cosign signatures, the GitHub release
#   wiki      after publish: the public wiki is deployed from the tagged commit (wiki-deploy.yml), betas included
# Nothing here creates or pushes a tag.
# Signing (docs/security.md, "Release signing"): there is no signing key to keep. The publish job signs every file with
# Sigstore cosign "keyless" (the GitHub Actions OIDC identity of this workflow, recorded in the public Rekor log) and
# attaches a GitHub build-provenance attestation (SLSA style). Users verify with `cosign verify-blob` or
# `gh attestation verify` (wiki/docs/install.md, "Verify your download").
# Actions are pinned by commit SHA (the comment is the tag).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      skip_gates:
        description: "Emergency only: build even though CI is not green for this commit"
        type: boolean
        default: false
      gates_only:
        description: "Dry run: only decide whether this commit could be released (nothing is built or published)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  gates:
    # Pushes to main do not run the full CI any more (docs/ci-gates.md): the pull request that was merged did, on a branch
    # that had to be up to date. build-aux/release-gate.py decides (tested in build-aux/tests/test_release_gate.py).
    name: CI passed for this commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      checks: read
      actions: read
      pull-requests: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The commit passed CI (its `required` check, a green Nightly, or the merged pull request with an equal tree)
        env:
          GH_TOKEN: ${{ github.token }}
          SKIP: ${{ inputs.skip_gates }}
        run: |
          args=()
          if [ "$SKIP" = true ]; then args+=(--skip); fi
          python3 build-aux/release-gate.py --repo "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" "${args[@]}"

  tarball:
    name: Release build and tarball
    needs: gates
    if: ${{ !inputs.gates_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # The oldest supported base, NOT fedora:latest: a binary needs the glibc of the machine it was built on (Fedora 45 has
    # 2.44, so the first beta ran nowhere else). Fedora 43 has glibc 2.42, GTK 4.20 and libadwaita 1.8, the minimum Bookx
    # needs, so the packages run on Fedora 43+, Ubuntu 25.10+, Debian testing, Arch and openSUSE Tumbleweed.
    # build-aux/distro-matrix.sh proves it before every release (job `distros`).
    container: fedora:43
    env:
      RUST_TOOLCHAIN: "1.93.1"
      RUSTUP_INIT_SKIP_SUDO_CHECK: "yes"
    defaults:
      run:
        shell: bash
    steps:
      - name: Install system dependencies
        run: |
          dnf install -y gcc gcc-c++ make pkgconf-pkg-config rustup \
            gtk4-devel libadwaita-devel gtksourceview5-devel pango-devel cairo-devel \
            gdk-pixbuf2-devel openssl-devel gettext tar gzip git python3 python3-pyyaml \
            desktop-file-utils appstream libxml2
      - name: Rust toolchain (the one CI tests with)
        run: |
          rustup-init -y --profile minimal --default-toolchain "$RUST_TOOLCHAIN"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Release check (versions, changelog, metainfo, Flatpak sources, golden plugins)
        run: |
          git config --global --add safe.directory "$PWD"
          case "$GITHUB_REF" in refs/tags/*) tag="$GITHUB_REF_NAME" ;; *) tag="" ;; esac
          build-aux/release-check.sh ${tag:+"$tag"}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release
      - name: Build
        run: cargo build --release --locked -p bookx -p bookx-cli
      - name: Tarball
        run: build-aux/tarball.sh dist
      - name: Debian and RPM packages
        run: |
          cargo install --locked cargo-deb cargo-generate-rpm
          cargo deb --no-build -p bookx --output dist/
          # RPM versions cannot contain '-': 0.3.0-beta.1 becomes 0.3.0~beta.1 (sorts before 0.3.0, like the .deb)
          rpm_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1 | tr '-' '~')
          cargo generate-rpm -p . -o dist/ -s "version = \"$rpm_version\""
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarball
          path: dist/*

  distros:
    name: Packages run on the supported distributions
    needs: tarball
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: build-aux/distro-matrix.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tarball
          path: dist
      - name: Install the .deb, .rpm and tarball in real distribution images and start the app
        run: JOBS=3 build-aux/distro-matrix.sh dist

  version:
    name: Version from the tag
    needs: gates
    if: ${{ !inputs.gates_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          case "$GITHUB_REF" in refs/tags/v*) v=${GITHUB_REF_NAME#v} ;; *) v="" ;; esac
          echo "version=$v" >> "$GITHUB_OUTPUT"

  flatpak:
    name: Flatpak bundle
    needs: version
    uses: ./.github/workflows/_flatpak.yml
    with:
      version: ${{ needs.version.outputs.version }}

  publish:
    name: Sign and attach to the release
    needs: [tarball, distros, flatpak, version]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write       # keyless signing: the workflow's OIDC token
      attestations: write   # build provenance
    steps:
      # checkout first: it cleans the workspace and would delete the downloaded files
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: build-aux/release-names.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Native file names (build-aux/release-names.sh)
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: build-aux/release-names.sh dist "$VERSION"
      - name: Checksums of everything
        run: |
          cd dist
          sums=$(find . -maxdepth 1 -type f ! -name '*.sha256' ! -name SHA256SUMS -printf '%f\n' | LC_ALL=C sort | xargs -d '\n' sha256sum)
          printf '%s\n' "$sums" > SHA256SUMS
          cat SHA256SUMS
      - name: Build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign every file with cosign (keyless, bundle next to the file)
        run: |
          cd dist
          for f in *; do
            case "$f" in *.sigstore.json) continue ;; esac
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
          ls -l
      - name: Verify what was just signed (same check users run)
        run: |
          cd dist
          for f in *; do
            case "$f" in *.sigstore.json) continue ;; esac
            cosign verify-blob \
              --bundle "$f.sigstore.json" \
              --certificate-identity-regexp '^https://github\.com/adhadse/Bookx/\.github/workflows/release\.yml@refs/tags/v' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$f"
          done
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: dist/*
          generate_release_notes: true
          # never a pre-release: GitHub keeps those out of the Releases box of the repository page. The newest release is "Latest".
          prerelease: false
          make_latest: true

  wiki:
    # The documentation goes live with the release, after the assets are out: a failure here is red but changes nothing
    # about the release. Not for manual runs without a tag.
    name: Deploy the wiki
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/wiki-deploy.yml
    with:
      ref: ${{ github.ref_name }}
    permissions:
      contents: read
      pages: write
      id-token: write
