name: Feature request
description: An idea or a missing capability
labels: [enhancement]
body:
  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do?
      description: Describe the task, not only the feature. What do you do today instead?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like Bookx to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and other apps
      description: How do Calibre, KOReader, GNOME Books or others handle it?
  - type: checkboxes
    id: help
    attributes:
      label: Contribution
      options:
        - label: I could help to build or test this
